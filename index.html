<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TATHOI - 3D Deep Space Universe</title>

  <!-- Google Fonts: Luxury High-Contrast Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    /* পিওর ডিপ ব্ল্যাক ইউনিভার্স ব্যাকগ্রাউন্ড */
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Cinzel Decorative', 'Playfair Display', serif;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* ইউনিভার্স লাক্সারি গ্লাস লোডার */
    #loader-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
      background: radial-gradient(circle at center, #100014 0%, #000000 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    #loader-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 42, 133, 0.4);
      border-radius: 24px;
      padding: 42px 36px;
      text-align: center;
      box-shadow: 0 0 60px rgba(255, 20, 147, 0.35), inset 0 0 25px rgba(255, 20, 147, 0.15);
      backdrop-filter: blur(18px);
      max-width: 320px;
      width: 86%;
      animation: floatUniverse 3.5s ease-in-out infinite alternate;
    }

    .heart-icon-box {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px;
    }

    .heart-icon-box svg {
      width: 100%;
      height: 100%;
      fill: #ff2a85;
      filter: drop-shadow(0 0 20px #ff2a85) drop-shadow(0 0 40px #ff73b3);
      animation: pulseGlow 1.1s infinite alternate cubic-bezier(0.2, 0.8, 0.4, 1);
    }

    .loader-title {
      font-size: 26px;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 0 0 15px #ff2a85, 0 0 35px #ff73b3;
      margin-bottom: 24px;
      font-weight: 900;
    }

    .enter-btn {
      background: linear-gradient(135deg, #ff2a85, #ff73b3);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 13px 30px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 42, 133, 0.8);
      transition: all 0.3s ease;
      display: inline-block;
      text-transform: uppercase;
    }

    .enter-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 45px rgba(255, 42, 133, 1);
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.92); opacity: 0.85; }
      100% { transform: scale(1.16); opacity: 1; filter: drop-shadow(0 0 30px #ff1493); }
    }

    @keyframes floatUniverse {
      0% { transform: translateY(-6px); }
      100% { transform: translateY(6px); }
    }

    /* মিনিমাল সাউন্ড বাটন */
    .mini-audio-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 42, 133, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 105, 180, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
      transition: all 0.3s ease;
    }

    .mini-audio-btn:hover {
      transform: scale(1.12);
    }

    .mini-audio-btn svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
      filter: drop-shadow(0 0 4px #ff1493);
    }

    /* কুইক টুলবার */
    .media-config-bar {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    .config-label {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 105, 180, 0.4);
      color: #fff;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
      font-family: sans-serif;
    }

    .config-label:hover {
      background: rgba(255, 42, 133, 0.3);
      box-shadow: 0 0 15px rgba(255, 42, 133, 0.5);
    }
  </style>

  <!-- Three.js + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- থ্রিডি ক্যানভাস -->
  <canvas id="webgl-canvas"></canvas>

  <!-- প্রিমিয়াম লোডার স্ক্রিন -->
  <div id="loader-screen">
    <div class="loader-card">
      <div class="heart-icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="loader-title">TATHOI</div>
      <button class="enter-btn" id="enterBtn">✨ ENTER UNIVERSE ✨</button>
    </div>
  </div>

  <!-- সাউন্ড টগল -->
  <div class="mini-audio-btn" id="audioToggle">
    <svg id="audioIcon" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mp3">
  </audio>

  <div class="media-config-bar">
    <label class="config-label">📷 Change Photo <input type="file" id="photoInput" accept="image/*" style="display:none"></label>
    <label class="config-label">🎵 Change Music <input type="file" id="audioInput" accept="audio/*" style="display:none"></label>
  </div>

  <script>
    /* ==========================================================================
       👉 ১. আপনার ছবির নাম এখানে লিখুন (JPG বা PNG):
       (ফাইলটি index.html ফাইলের সাথে একই ফোল্ডারে রাখবেন)
    ========================================================================== */
    const MY_IMAGE_FILE = "character.jpg"; 


    // --- ২. Three.js ডিপ স্পেস ইউনিভার্স সেটআপ ---
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000); // খাঁটি পিচ ব্ল্যাক মহাকাশ
    scene.fog = new THREE.FogExp2(0x000000, 0.0016);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1400);
    camera.position.set(0, 10, 130);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.85;
    controls.enablePan = false;
    controls.minDistance = 25;
    controls.maxDistance = 260;

    // --- ৩. মহাকাশের নক্ষত্ররাজি (৩০০০+ Twinkling Stars in 360°) ---
    const starCount = 3200;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 800;
      starPos[i + 1] = (Math.random() - 0.5) * 800;
      starPos[i + 2] = (Math.random() - 0.5) * 800;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 1.6,
      transparent: true,
      opacity: 0.85
    });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // --- ৪. আল্ট্রা-শার্প হাই রেজোলিউশন টেক্সট (2048x512) ---
    function createUltraCrispTextTexture(text) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 2048;
      c.height = 512;

      ctx.clearRect(0, 0, c.width, c.height);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 135px "Cinzel Decorative", "Playfair Display", Georgia, serif';

      // সফট শার্প হোয়াইট নিয়ন কোর
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, c.width / 2, c.height / 2);

      // শার্প আউটলাইন
      ctx.shadowBlur = 0;
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeText(text, c.width / 2, c.height / 2);
      ctx.fillText(text, c.width / 2, c.height / 2);

      const texture = new THREE.CanvasTexture(c);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return texture;
    }
    const textTexture = createUltraCrispTextTexture('TATHOI');

    // --- ৫. স্কয়ার (1:1 Square Shape) ইমেজ ফ্রেম টেক্সচার ---
    const squareCanvas = document.createElement('canvas');
    const squareCtx = squareCanvas.getContext('2d');
    squareCanvas.width = 512;
    squareCanvas.height = 512;
    const squareTexture = new THREE.CanvasTexture(squareCanvas);
    squareTexture.minFilter = THREE.LinearFilter;
    squareTexture.magFilter = THREE.LinearFilter;

    function renderSquareAvatar(imageElement) {
      squareCtx.clearRect(0, 0, 512, 512);

      const boxSize = 440;
      const x = 36;
      const y = 36;
      const radius = 32;

      // 1:1 স্কয়ার কর্নার ক্লিপ
      squareCtx.save();
      squareCtx.beginPath();
      squareCtx.moveTo(x + radius, y);
      squareCtx.lineTo(x + boxSize - radius, y);
      squareCtx.quadraticCurveTo(x + boxSize, y, x + boxSize, y + radius);
      squareCtx.lineTo(x + boxSize, y + boxSize - radius);
      squareCtx.quadraticCurveTo(x + boxSize, y + boxSize, x + boxSize - radius, y + boxSize);
      squareCtx.lineTo(x + radius, y + boxSize);
      squareCtx.quadraticCurveTo(x, y + boxSize, x, y + boxSize - radius);
      squareCtx.lineTo(x, y + radius);
      squareCtx.quadraticCurveTo(x, y, x + radius, y);
      squareCtx.closePath();
      squareCtx.clip();

      if (imageElement && imageElement.complete && imageElement.naturalWidth !== 0) {
        // ১:১ নিখুঁত সেন্টার ক্রপ
        const minSide = Math.min(imageElement.width, imageElement.height);
        const sx = (imageElement.width - minSide) / 2;
        const sy = (imageElement.height - minSide) / 2;
        squareCtx.drawImage(imageElement, sx, sy, minSide, minSide, x, y, boxSize, boxSize);
      } else {
        // ফলব্যাক নিয়ন পিংক
        const grad = squareCtx.createLinearGradient(0, 0, 512, 512);
        grad.addColorStop(0, '#ff2a85');
        grad.addColorStop(1, '#5e002a');
        squareCtx.fillStyle = grad;
        squareCtx.fill();
      }
      squareCtx.restore();

      // স্কয়ার বর্ডার
      squareCtx.beginPath();
      squareCtx.moveTo(x + radius, y);
      squareCtx.lineTo(x + boxSize - radius, y);
      squareCtx.quadraticCurveTo(x + boxSize, y, x + boxSize, y + radius);
      squareCtx.lineTo(x + boxSize, y + boxSize - radius);
      squareCtx.quadraticCurveTo(x + boxSize, y + boxSize, x + boxSize - radius, y + boxSize);
      squareCtx.lineTo(x + radius, y + boxSize);
      squareCtx.quadraticCurveTo(x, y + boxSize, x, y + boxSize - radius);
      squareCtx.lineTo(x, y + radius);
      squareCtx.quadraticCurveTo(x, y, x + radius, y);
      squareCtx.closePath();

      squareCtx.lineWidth = 14;
      squareCtx.strokeStyle = '#ffffff';
      squareCtx.shadowColor = '#ff2a85';
      squareCtx.shadowBlur = 28;
      squareCtx.stroke();

      squareTexture.needsUpdate = true;
    }

    // আপনার ছবি লোড করার লজিক
    const myImg = new Image();
    myImg.src = MY_IMAGE_FILE;
    myImg.onload = () => renderSquareAvatar(myImg);
    myImg.onerror = () => {
      console.warn("ফাইল খুঁজে পাওয়া যায়নি! অনুগ্রহ করে ফোল্ডারে " + MY_IMAGE_FILE + " ফাইলটি রাখুন।");
      renderSquareAvatar(null);
    };

    // --- ৬. ইমোজি টেক্সচার ---
    function createEmojiTexture(char) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 256;
      c.height = 256;
      ctx.font = '130px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ff2a85';
      ctx.shadowBlur = 20;
      ctx.fillText(char, 128, 138);
      return new THREE.CanvasTexture(c);
    }
    const emojiRibbon = createEmojiTexture('🎀');
    const emojiHeart = createEmojiTexture('💖');

    // --- ৭. উপাদান ম্যাটেরিয়ালস ---
    const sharedTextMaterial = new THREE.SpriteMaterial({
      map: textTexture,
      transparent: true,
      opacity: 0.98,
      color: 0xff2a85
    });

    const sharedAvatarMaterial = new THREE.SpriteMaterial({
      map: squareTexture,
      transparent: true,
      opacity: 0.98,
      color: 0xffffff
    });

    const sharedRibbonMaterial = new THREE.SpriteMaterial({ map: emojiRibbon, transparent: true, opacity: 0.95 });
    const sharedHeartMaterial = new THREE.SpriteMaterial({ map: emojiHeart, transparent: true, opacity: 0.95 });

    // --- ৮. মহাকাশে ভাসমান উপাদান (Dense Rain) ---
    const items = [];
    const itemCount = 270;
    const fieldWidth = 130;
    const fieldHeight = 260;
    const fieldDepth = 130;

    for (let i = 0; i < itemCount; i++) {
      let mat, scaleX, scaleY;
      const rand = Math.random();

      if (rand < 0.52) {
        mat = sharedTextMaterial;
        scaleX = 24;
        scaleY = 6;
      } else if (rand < 0.76) {
        mat = sharedAvatarMaterial;
        scaleX = 10;
        scaleY = 10; // পারফেক্ট ১:১ স্কয়ার
      } else if (rand < 0.88) {
        mat = sharedRibbonMaterial;
        scaleX = 6.5;
        scaleY = 6.5;
      } else {
        mat = sharedHeartMaterial;
        scaleX = 6.5;
        scaleY = 6.5;
      }

      const sprite = new THREE.Sprite(mat);
      sprite.position.set(
        (Math.random() - 0.5) * fieldWidth,
        (Math.random() - 0.5) * fieldHeight,
        (Math.random() - 0.5) * fieldDepth
      );
      sprite.scale.set(scaleX, scaleY, 1);

      sprite.userData = {
        speed: 0.38 + Math.random() * 0.45,
        swaySpeed: 1.5 + Math.random() * 2,
        swayOffset: Math.random() * Math.PI * 2,
        swayAmp: 0.04 + Math.random() * 0.04
      };

      scene.add(sprite);
      items.push(sprite);
    }

    // --- ৯. সিঙ্কড কালার ইঞ্জিন (সব উপাদান একসাথে রঙ বদলাবে) ---
    const currentColor = new THREE.Color();
    let clock = new THREE.Clock();

    function updateSynchronizedColor(time) {
      // ৩১৫° থেকে ৩৫৫° এর মধ্যে পিংক, হট মেজেন্টা ও ডিপ রোজ রঙে ঘুরবে
      const hue = (Math.sin(time * 0.6) * 0.5 + 0.5) * (355 - 315) + 315; 
      currentColor.setHSL(hue / 360, 1.0, 0.62);

      sharedTextMaterial.color.copy(currentColor);
    }

    // --- ১০. অ্যানিমেশন লুপ ---
    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // কালার ট্রানজিশন
      updateSynchronizedColor(elapsedTime);

      // উপর থেকে নিচে ইউনিভার্সে নেমে আসা
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        item.position.y -= item.userData.speed;
        item.position.x += Math.sin(elapsedTime * item.userData.swaySpeed + item.userData.swayOffset) * item.userData.swayAmp;

        if (item.position.y < -fieldHeight / 2) {
          item.position.y = fieldHeight / 2;
          item.position.x = (Math.random() - 0.5) * fieldWidth;
          item.position.z = (Math.random() - 0.5) * fieldDepth;
        }
      }

      // ইউনিভার্সের তারাগুলো আস্তে আস্তে ঘুরবে
      starField.rotation.y = elapsedTime * 0.012;
      starField.rotation.x = elapsedTime * 0.006;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- ১১. মিউজিক এবং এন্টার বাটন হ্যান্ডলিং ---
    const bgMusic = document.getElementById('bgMusic');
    const enterBtn = document.getElementById('enterBtn');
    const loaderScreen = document.getElementById('loader-screen');
    const audioToggle = document.getElementById('audioToggle');

    enterBtn.addEventListener('click', () => {
      bgMusic.play().then(() => {
        audioToggle.style.opacity = '1';
      }).catch(err => {
        console.log("Audio play error: ", err);
      });

      loaderScreen.classList.add('fade-out');
    });

    audioToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        bgMusic.play();
        audioToggle.style.opacity = '1';
        audioToggle.style.boxShadow = '0 0 18px rgba(255, 20, 147, 0.8)';
      } else {
        bgMusic.pause();
        audioToggle.style.opacity = '0.35';
        audioToggle.style.boxShadow = 'none';
      }
    });

    // --- ১২. ইনস্ট্যান্ট ইমেজ ও অডিও সিলেক্টর ---
    document.getElementById('photoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const userImg = new Image();
          userImg.onload = () => renderSquareAvatar(userImg);
          userImg.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('audioInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        bgMusic.src = URL.createObjectURL(file);
        bgMusic.play();
      }
    });

    // রেসপনসিভ উইন্ডো
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
