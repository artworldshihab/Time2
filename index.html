<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TATHOI - 3D Deep Space Universe</title>

  <!-- Google Fonts: Luxury High-Contrast Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Cinzel Decorative', 'Playfair Display', serif;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* ইউনিভার্স লাক্সারি গ্লাস লোডার */
    #loader-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999;
      background: radial-gradient(circle at center, #100014 0%, #000000 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    #loader-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 42, 133, 0.4);
      border-radius: 24px;
      padding: 42px 36px;
      text-align: center;
      box-shadow: 0 0 60px rgba(255, 20, 147, 0.35), inset 0 0 25px rgba(255, 20, 147, 0.15);
      backdrop-filter: blur(18px);
      max-width: 320px;
      width: 86%;
      animation: floatUniverse 3.5s ease-in-out infinite alternate;
    }

    .heart-icon-box {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px;
    }

    .heart-icon-box svg {
      width: 100%;
      height: 100%;
      fill: #ff2a85;
      filter: drop-shadow(0 0 20px #ff2a85) drop-shadow(0 0 40px #ff73b3);
      animation: pulseGlow 1.1s infinite alternate cubic-bezier(0.2, 0.8, 0.4, 1);
    }

    .loader-title {
      font-size: 28px;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 0 0 15px #ff2a85, 0 0 35px #ff73b3;
      margin-bottom: 24px;
      font-weight: 900;
    }

    .enter-btn {
      background: linear-gradient(135deg, #ff2a85, #ff73b3);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 13px 30px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 42, 133, 0.8);
      transition: all 0.3s ease;
      display: inline-block;
      text-transform: uppercase;
    }

    .enter-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 45px rgba(255, 42, 133, 1);
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.92); opacity: 0.85; }
      100% { transform: scale(1.16); opacity: 1; filter: drop-shadow(0 0 30px #ff1493); }
    }

    @keyframes floatUniverse {
      0% { transform: translateY(-6px); }
      100% { transform: translateY(6px); }
    }

    /* মিনিমাল সাউন্ড টগল বাটন */
    .mini-audio-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 42, 133, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 105, 180, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
      transition: all 0.3s ease;
    }

    .mini-audio-btn:hover {
      transform: scale(1.12);
    }

    .mini-audio-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      filter: drop-shadow(0 0 4px #ff1493);
    }
  </style>

  <!-- Three.js + Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- ৩ডি ক্যানভাস -->
  <canvas id="webgl-canvas"></canvas>

  <!-- লাক্সারি লোডার স্ক্রিন -->
  <div id="loader-screen">
    <div class="loader-card">
      <div class="heart-icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="loader-title">TATHOI</div>
      <button class="enter-btn" id="enterBtn">✨ ENTER UNIVERSE ✨</button>
    </div>
  </div>

  <!-- সাউন্ড বাটন -->
  <div class="mini-audio-btn" id="audioToggle">
    <svg id="audioIcon" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mp3">
  </audio>

  <script>
    // ক্লাউডিনারি সরাসরি ইমেজ লিঙ্ক
    const MY_IMAGE_FILE = "https://res.cloudinary.com/nfw27bw2/image/upload/f_auto,q_auto/1000047712";

    // --- ১. Three.js ইউনিভার্স ইনিশিয়ালাইজেশন ---
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000); // ডিপ ব্ল্যাক স্পেস
    scene.fog = new THREE.FogExp2(0x000000, 0.0018);

    // ক্যামেরা একটু কাছে আনা হয়েছে যেন সবকিছু বড় ও স্পষ্ট দেখায়
    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1200);
    camera.position.set(0, 5, 100);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.85;
    controls.enablePan = false;
    controls.minDistance = 25;
    controls.maxDistance = 220;

    // --- ২. মহাকাশের নক্ষত্ররাজি (৩২০০+ Twinkling Stars in 360°) ---
    const starCount = 3200;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 800;
      starPos[i + 1] = (Math.random() - 0.5) * 800;
      starPos[i + 2] = (Math.random() - 0.5) * 800;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 1.8,
      transparent: true,
      opacity: 0.85
    });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    // --- ৩. বড় ও আল্ট্রা-শার্প হাই-রেজোলিউশন টেক্সট (TATHOI) ---
    function createUltraCrispTextTexture(text) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 2048;
      c.height = 512;

      ctx.clearRect(0, 0, c.width, c.height);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 165px "Cinzel Decorative", "Playfair Display", Georgia, serif';

      // স্ট্রং হোয়াইট নিয়ন কোর
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 24;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, c.width / 2, c.height / 2);

      // শার্প আউটলাইন
      ctx.shadowBlur = 0;
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeText(text, c.width / 2, c.height / 2);
      ctx.fillText(text, c.width / 2, c.height / 2);

      const texture = new THREE.CanvasTexture(c);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return texture;
    }
    const textTexture = createUltraCrispTextTexture('TATHOI');

    // --- ৪. ১:১ স্কয়ার (1:1 Square) ফটো ফ্রেম + স্কয়ার নিয়ন স্নেক অ্যানিমেশন ---
    const squareCanvas = document.createElement('canvas');
    const squareCtx = squareCanvas.getContext('2d');
    squareCanvas.width = 1024;
    squareCanvas.height = 1024;
    const squareTexture = new THREE.CanvasTexture(squareCanvas);
    squareTexture.minFilter = THREE.LinearFilter;
    squareTexture.magFilter = THREE.LinearFilter;

    // ক্যাশড ফটো ক্যানভাস (১:১ স্কয়ার শেপ)
    const photoCacheCanvas = document.createElement('canvas');
    const photoCacheCtx = photoCacheCanvas.getContext('2d');
    photoCacheCanvas.width = 1024;
    photoCacheCanvas.height = 1024;
    let isPhotoReady = false;

    // স্কয়ার ফ্রেমের মাপ
    const sqX = 70, sqY = 70, sqSize = 884, sqRadius = 40;

    function roundedRectPath(ctx, x, y, size, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + size - radius, y);
      ctx.quadraticCurveTo(x + size, y, x + size, y + radius);
      ctx.lineTo(x + size, y + size - radius);
      ctx.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
      ctx.lineTo(x + radius, y + size);
      ctx.quadraticCurveTo(x, y + size, x, y + size - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    const myImg = new Image();
    myImg.crossOrigin = "anonymous";
    myImg.src = MY_IMAGE_FILE;
    myImg.onload = () => {
      photoCacheCtx.save();
      roundedRectPath(photoCacheCtx, sqX, sqY, sqSize, sqRadius);
      photoCacheCtx.clip();

      // পারফেক্ট ১:১ সেন্টার ক্রপ
      const minSide = Math.min(myImg.width, myImg.height);
      const sx = (myImg.width - minSide) / 2;
      const sy = (myImg.height - minSide) / 2;
      photoCacheCtx.drawImage(myImg, sx, sy, minSide, minSide, sqX, sqY, sqSize, sqSize);
      photoCacheCtx.restore();
      isPhotoReady = true;
    };

    // স্কয়ারের পেরিমিটার জুড়ে স্নেকের পয়েন্ট নির্ণয় ফাংশন
    function getPointOnSquarePerimeter(dist, totalPerimeter, x, y, size) {
      let d = ((dist % totalPerimeter) + totalPerimeter) % totalPerimeter;
      if (d < size) {
        return { x: x + d, y: y }; // Top edge
      }
      d -= size;
      if (d < size) {
        return { x: x + size, y: y + d }; // Right edge
      }
      d -= size;
      if (d < size) {
        return { x: x + size - d, y: y + size }; // Bottom edge
      }
      d -= size;
      return { x: x, y: y + size - d }; // Left edge
    }

    // ১:১ স্কয়ার নিয়ন স্নেক অ্যানিমেশন রেন্ডারার
    function updateSquareSnakeFrame(time) {
      squareCtx.clearRect(0, 0, 1024, 1024);

      if (isPhotoReady) {
        squareCtx.drawImage(photoCacheCanvas, 0, 0);
      } else {
        // ছবি আসার আগ পর্যন্ত সফট পিংক ব্যাকগ্রাউন্ড
        squareCtx.save();
        roundedRectPath(squareCtx, sqX, sqY, sqSize, sqRadius);
        squareCtx.fillStyle = '#2b0015';
        squareCtx.fill();
        squareCtx.restore();
      }

      // বেস সফট স্কয়ার বর্ডার
      squareCtx.save();
      roundedRectPath(squareCtx, sqX, sqY, sqSize, sqRadius);
      squareCtx.lineWidth = 6;
      squareCtx.strokeStyle = 'rgba(255, 42, 133, 0.35)';
      squareCtx.shadowBlur = 0;
      squareCtx.stroke();
      squareCtx.restore();

      // স্কয়ার স্নেক অ্যানিমেশন লজিক
      const totalPerimeter = sqSize * 4;
      const snakeSpeed = 1600; // পিক্সেল/সেকেন্ড
      const headDist = (time * snakeSpeed) % totalPerimeter;
      const snakeLength = 950; // স্নেকের দৈর্ঘ্য
      const segments = 28;

      for (let i = 0; i < segments; i++) {
        const frac = i / segments;
        const d1 = headDist - snakeLength * (1 - frac);
        const d2 = headDist - snakeLength * (1 - (i + 1) / segments);

        const p1 = getPointOnSquarePerimeter(d1, totalPerimeter, sqX, sqY, sqSize);
        const p2 = getPointOnSquarePerimeter(d2, totalPerimeter, sqX, sqY, sqSize);

        squareCtx.beginPath();
        squareCtx.moveTo(p1.x, p1.y);
        squareCtx.lineTo(p2.x, p2.y);
        squareCtx.lineWidth = 6 + frac * 16; // হেডের কাছে মোটা হবে
        squareCtx.strokeStyle = `rgba(255, 42, 133, ${frac * 0.95})`;
        squareCtx.shadowColor = '#ff2a85';
        squareCtx.shadowBlur = 24 * frac;
        squareCtx.stroke();
      }

      // স্নেকের উজ্জ্বল গ্লোয়িং হেড
      const headPoint = getPointOnSquarePerimeter(headDist, totalPerimeter, sqX, sqY, sqSize);
      squareCtx.beginPath();
      squareCtx.arc(headPoint.x, headPoint.y, 14, 0, Math.PI * 2);
      squareCtx.fillStyle = '#ffffff';
      squareCtx.shadowColor = '#ffffff';
      squareCtx.shadowBlur = 35;
      squareCtx.fill();

      squareTexture.needsUpdate = true;
    }

    // --- ৫. বড় ইমোজি টেক্সচার ---
    function createEmojiTexture(char) {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      c.width = 256;
      c.height = 256;
      ctx.font = '145px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#ff2a85';
      ctx.shadowBlur = 25;
      ctx.fillText(char, 128, 138);
      return new THREE.CanvasTexture(c);
    }
    const emojiRibbon = createEmojiTexture('🎀');
    const emojiHeart = createEmojiTexture('💖');

    // --- ৬. শেয়ার্ড ম্যাটেরিয়ালস ---
    const sharedTextMaterial = new THREE.SpriteMaterial({
      map: textTexture,
      transparent: true,
      opacity: 0.98,
      color: 0xff2a85
    });

    const sharedAvatarMaterial = new THREE.SpriteMaterial({
      map: squareTexture,
      transparent: true,
      opacity: 0.98,
      color: 0xffffff
    });

    const sharedRibbonMaterial = new THREE.SpriteMaterial({ map: emojiRibbon, transparent: true, opacity: 0.95 });
    const sharedHeartMaterial = new THREE.SpriteMaterial({ map: emojiHeart, transparent: true, opacity: 0.95 });

    // --- ৭. বড়, চোখধাঁধানো ও সারিবদ্ধ ৩৬০° কলাম তৈরি ---
    const items = [];
    const fallHeight = 320;

    // ৩টি লেয়ারে ৩৬০° পরিধি জুড়ে কলামের বিন্যাস
    const ringConfigs = [
      { radius: 42, columns: 8, itemsPerCol: 6 },   // ভেতরের সারি
      { radius: 72, columns: 12, itemsPerCol: 6 },  // মাঝের সারি
      { radius: 105, columns: 16, itemsPerCol: 5 }  // বাইরের সারি
    ];

    ringConfigs.forEach((ring) => {
      const angleStep = (Math.PI * 2) / ring.columns;

      for (let c = 0; c < ring.columns; c++) {
        const colAngle = c * angleStep;
        const colX = Math.cos(colAngle) * ring.radius;
        const colZ = Math.sin(colAngle) * ring.radius;
        const colSpeed = 0.40 + (c % 3) * 0.08;

        for (let i = 0; i < ring.itemsPerCol; i++) {
          const typeIndex = (c + i) % 5;
          let mat, scaleX, scaleY;

          if (typeIndex === 0 || typeIndex === 2) {
            // TATHOI টেক্সট (অনেক বড় ও বোল্ড: 42 x 10.5)
            mat = sharedTextMaterial;
            scaleX = 42;
            scaleY = 10.5;
          } else if (typeIndex === 1) {
            // ১:১ স্কয়ার স্নেক ফটো ফ্রেম (বিশাল ও আকর্ষণীয়: 22 x 22)
            mat = sharedAvatarMaterial;
            scaleX = 22;
            scaleY = 22; // পারফেক্ট ১:১ স্কয়ার
          } else if (typeIndex === 3) {
            // রিবন
            mat = sharedRibbonMaterial;
            scaleX = 13;
            scaleY = 13;
          } else {
            // গ্লিটার হার্ট
            mat = sharedHeartMaterial;
            scaleX = 13;
            scaleY = 13;
          }

          const sprite = new THREE.Sprite(mat);
          const yPos = (fallHeight / ring.itemsPerCol) * i - (fallHeight / 2);
          sprite.position.set(colX, yPos, colZ);
          sprite.scale.set(scaleX, scaleY, 1);

          sprite.userData = {
            speed: colSpeed
          };

          scene.add(sprite);
          items.push(sprite);
        }
      }
    });

    // --- ৮. সিঙ্কড কালার ট্রানজিশন ইঞ্জিন ---
    const currentColor = new THREE.Color();
    let clock = new THREE.Clock();

    function updateSynchronizedColor(time) {
      // ৩১৫° থেকে ৩৫৫° এর মধ্যে পিংক, হট মেজেন্টা ও ডিপ রোজ রঙে ঘুরবে
      const hue = (Math.sin(time * 0.6) * 0.5 + 0.5) * (355 - 315) + 315; 
      currentColor.setHSL(hue / 360, 1.0, 0.62);

      sharedTextMaterial.color.copy(currentColor);
    }

    // --- ৯. অ্যানিমেশন ও রেন্ডার লুপ ---
    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // ১:১ স্কয়ার ফ্রেমের চারপাশের নিয়ন স্নেক অ্যানিমেশন
      updateSquareSnakeFrame(elapsedTime);

      // টেক্সট কালার সিঙ্ক
      updateSynchronizedColor(elapsedTime);

      // সারিবদ্ধভাবে ৩৬০° কলামে ওপর থেকে নিচে ঝরে পড়া
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        item.position.y -= item.userData.speed;

        if (item.position.y < -fallHeight / 2) {
          item.position.y = fallHeight / 2;
        }
      }

      // নক্ষত্ররাজির হালকা ঘূর্ণন
      starField.rotation.y = elapsedTime * 0.012;
      starField.rotation.x = elapsedTime * 0.006;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- ১০. মিউজিক এবং এন্টার বাটন হ্যান্ডলিং ---
    const bgMusic = document.getElementById('bgMusic');
    const enterBtn = document.getElementById('enterBtn');
    const loaderScreen = document.getElementById('loader-screen');
    const audioToggle = document.getElementById('audioToggle');

    enterBtn.addEventListener('click', () => {
      bgMusic.play().then(() => {
        audioToggle.style.opacity = '1';
      }).catch(err => {
        console.log("Audio autoplay error: ", err);
      });

      loaderScreen.classList.add('fade-out');
    });

    audioToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        bgMusic.play();
        audioToggle.style.opacity = '1';
        audioToggle.style.boxShadow = '0 0 18px rgba(255, 20, 147, 0.8)';
      } else {
        bgMusic.pause();
        audioToggle.style.opacity = '0.35';
        audioToggle.style.boxShadow = 'none';
      }
    });

    // রেসপনসিভ উইন্ডো
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
