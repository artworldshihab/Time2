<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Liquid Glass Studio AOD</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ================= 1. Global Reset & 16:9 TV Ratio ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #020408;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* ================= 2. tv wall.jpg Cinematic Layer ================= */
    .tv-wallpaper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('tv wall.jpg') center center / cover no-repeat;
      z-index: 1;
      filter: brightness(0.70) contrast(1.18) saturate(1.12); /* Balanced for OLED TVs */
    }

    /* Ambient Soft Edge Vignette */
    .ambient-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 75% 35%, rgba(0, 0, 0, 0.05) 0%, rgba(2, 4, 10, 0.75) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* 3D Realistic Falling Snow Canvas */
    #snow-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* Top Discrete Status Badge */
    .top-status-bar {
      position: absolute;
      top: 28px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.65);
      z-index: 10;
    }

    .status-capsule {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 14px;
      border-radius: 9999px;
      box-shadow: inset 1px -1px 1px rgba(255,255,255,0.4), inset -1px 1px 1px rgba(255,255,255,0.2);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #30d158;
      border-radius: 50%;
      box-shadow: 0 0 10px #30d158;
      animation: aodBlink 2.2s infinite ease-in-out;
    }

    @keyframes aodBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    /* ================= 3. Perfect Responsive AOD Layout ================= */
    .aod-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 4.5vh 4vw;
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
      z-index: 5;
    }

    /* ================= 4. Left Widgets Stack ================= */
    .left-widget-dock {
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 6;
    }

    /* Pure Optical Liquid Glass Card */
    .liquid-card {
      position: relative;
      width: 100%;
      padding: 16px 18px;
      border-radius: 24px;
      border: 1px double rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      
      /* Optical Inset Specular formula */
      box-shadow:
        inset 2px -2px 1px -1px rgba(255, 255, 255, 0.8),
        inset -2px 2px 1px -1px rgba(255, 255, 255, 0.8),
        inset 6px -6px 1px -6px rgba(255, 255, 255, 0.4),
        inset -6px 6px 1px -6px rgba(255, 255, 255, 0.4),
        inset 0 0 3px rgba(0, 0, 0, 0.75),
        0 20px 45px rgba(0, 0, 0, 0.55);
    }

    .liquid-card::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.3) 0%,
        transparent 20%,
        transparent 80%,
        rgba(255, 255, 255, 0.2) 100%
      );
      filter: blur(3px);
    }

    /* 1. Calendar */
    .cal-header-txt {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }
    .cal-days-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 6px;
    }
    .cal-days-body {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
    }
    .cal-days-body span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }
    .cal-days-body span.today-active {
      background: #ffffff;
      color: #020408;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.95);
    }

    /* 2. Live Markets: AAPL & GOLD */
    .market-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .market-row-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .market-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .market-sub-title {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
    }
    .market-numbers {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
    }
    .market-price-val {
      font-size: 14px;
      font-weight: 600;
    }
    .market-gain-val {
      font-size: 11px;
      font-weight: 600;
      color: #30d158;
    }
    .mini-chart {
      width: 100%;
      height: 20px;
      margin-top: 2px;
    }

    /* 3. Battery / AC Gauge */
    .power-capsule {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 22px;
      border-radius: 9999px;
    }
    .power-ring-box {
      position: relative;
      width: 42px;
      height: 42px;
    }
    .power-ring-box svg {
      transform: rotate(-90deg);
      width: 42px;
      height: 42px;
    }
    .gauge-track {
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 4;
      fill: none;
    }
    .gauge-fill-active {
      stroke: #30d158;
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 120;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.8s ease;
    }
    .gauge-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 13px;
    }
    .power-value-txt {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }
    .power-state-txt {
      font-size: 9px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* 4. Live Weather */
    .weather-container {
      padding: 2px 4px;
    }
    .weather-location-txt {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .weather-temp-giant {
      font-size: 58px;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      margin: 4px 0;
    }
    .weather-desc-txt {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.4;
    }

    /* ================= 5. Center-Stage Apple Liquid Glass Timepiece ================= */
    .timepiece-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: -3vh;
    }

    /* Elegant Date Banner */
    .date-badge-top {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      margin-bottom: -15px;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
      z-index: 5;
    }

    /* Time Flex Container */
    .time-flex-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Apple Ultra-Tall Water Refraction Glass Digits */
    .tall-liquid-clock {
      font-family: 'Antonio', sans-serif;
      font-size: 34vw;
      font-weight: 700;
      line-height: 0.82;
      letter-spacing: -0.6vw;
      transform: scaleY(1.36);
      transform-origin: top center;
      
      /* Pure Crystal Water Glass Shader */
      background: linear-gradient(180deg, 
                  rgba(255, 255, 255, 0.96) 0%, 
                  rgba(255, 255, 255, 0.16) 48%, 
                  rgba(255, 255, 255, 0.42) 78%, 
                  rgba(255, 255, 255, 0.08) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.52);
      filter: drop-shadow(0 25px 60px rgba(0, 0, 0, 0.95))
              drop-shadow(0 0 40px rgba(255, 255, 255, 0.18));
      mix-blend-mode: screen;
    }

    /* Integrated Liquid Seconds Badge Mounted Beside Minutes */
    .seconds-dock-badge {
      position: absolute;
      right: -3.8vw;
      bottom: 24%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(25px) saturate(200%);
      -webkit-backdrop-filter: blur(25px) saturate(200%);
      border: 1px double rgba(255, 255, 255, 0.2);

      box-shadow:
        inset 1px -1px 1px rgba(255, 255, 255, 0.8),
        inset -1px 1px 1px rgba(255, 255, 255, 0.8),
        0 15px 35px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .seconds-display-digit {
      font-family: 'Antonio', sans-serif;
      font-size: 42px;
      line-height: 0.9;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.85);
    }

    /* Live Tick Animation */
    .sec-tick-effect {
      animation: secPushPulse 0.25s ease-out;
    }

    @keyframes secPushPulse {
      0% { transform: translateY(-3px) scale(1.08); opacity: 0.7; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .sec-bottom-tag {
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- tv wall.jpg Wallpaper Layer -->
  <div class="tv-wallpaper"></div>
  <div class="ambient-vignette"></div>

  <!-- 3D Realistic Falling Snow Canvas -->
  <canvas id="snow-canvas"></canvas>

  <!-- Top Right Live Status Pill -->
  <aside class="top-status-bar">
    <div class="status-capsule">
      <span class="pulse-dot"></span>
      <span>AOD ENGINE ACTIVE</span>
    </div>
  </aside>

  <!-- Main Viewport Layout -->
  <main class="aod-viewport">

    <!-- Left Widgets Column -->
    <section class="left-widget-dock">

      <!-- 1. Real-time Calendar Grid -->
      <div class="liquid-card">
        <div class="cal-header-txt" id="cal-month-header">OCTOBER</div>
        <div class="cal-days-header">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="cal-days-body" id="cal-matrix-body"></div>
      </div>

      <!-- 2. Live Dual Markets: AAPL + GOLD -->
      <div class="liquid-card">
        <div class="market-stack">
          <!-- AAPL -->
          <div>
            <div class="market-row-flex">
              <div>
                <div class="market-title">AAPL</div>
                <div class="market-sub-title">Apple Inc.</div>
              </div>
              <div class="market-numbers">
                <div class="market-price-val" id="aapl-price">$245.80</div>
                <div class="market-gain-val" id="aapl-change">+2.32%</div>
              </div>
            </div>
            <svg class="mini-chart" viewBox="0 0 100 20">
              <path d="M0 15 Q 25 17, 45 9 T 70 7 T 85 3 T 100 5" fill="none" stroke="#30d158" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </div>

          <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.08);">

          <!-- GOLD -->
          <div>
            <div class="market-row-flex">
              <div>
                <div class="market-title">GOLD</div>
                <div class="market-sub-title">XAU / USD</div>
              </div>
              <div class="market-numbers">
                <div class="market-price-val" id="gold-price">$2,728.50</div>
                <div class="market-gain-val" id="gold-change">+0.86%</div>
              </div>
            </div>
            <svg class="mini-chart" viewBox="0 0 100 20">
              <path d="M0 14 Q 20 16, 40 8 T 65 6 T 85 2 T 100 4" fill="none" stroke="#ffd60a" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- 3. Hardware Battery Sensor -->
      <div class="liquid-card power-capsule">
        <div class="power-ring-box">
          <svg>
            <circle class="gauge-track" cx="21" cy="21" r="17"/>
            <circle class="gauge-fill-active" id="battery-fill-svg" cx="21" cy="21" r="17"/>
          </svg>
          <span class="gauge-icon">⚡</span>
        </div>
        <div>
          <div class="power-value-txt" id="battery-num-txt">100%</div>
          <div class="power-state-txt" id="battery-state-txt">AC CONNECTED</div>
        </div>
      </div>

      <!-- 4. Real Live Dhaka Weather (Open-Meteo Cloud) -->
      <div class="weather-container">
        <div class="weather-location-txt">DHAKA, BANGLADESH 📍</div>
        <div class="weather-temp-giant" id="weather-temp-txt">--°</div>
        <div class="weather-desc-txt" id="weather-details-txt">
          Syncing Satellite Data...<br>
          <span id="weather-range-txt">H: --° L: --°</span>
        </div>
      </div>

    </section>

    <!-- Center Stage Apple Liquid Glass Timepiece -->
    <section class="timepiece-stage">
      <div class="date-badge-top" id="live-date-header">SUNDAY, OCTOBER 18</div>
      
      <div class="time-flex-wrapper">
        <div class="tall-liquid-clock" id="clock-hours-mins">12:00</div>
        
        <!-- Live Animated Seconds Badge -->
        <div class="seconds-dock-badge">
          <div class="seconds-display-digit" id="clock-seconds">00</div>
          <div class="sec-bottom-tag">SEC</div>
        </div>
      </div>
    </section>

  </main>

  <!-- High-Performance JavaScript Engines -->
  <script>
    /* ================= 1. Real-Time System Clock & Seconds ================= */
    let lastRecordedSec = -1;

    function refreshSystemTime() {
      const now = new Date();

      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();

      hours = hours % 12 || 12; // 12-hour format
      const strH = String(hours).padStart(2, '0');
      const strM = String(minutes).padStart(2, '0');
      const strS = String(seconds).padStart(2, '0');

      document.getElementById('clock-hours-mins').textContent = `${strH}:${strM}`;

      const secEl = document.getElementById('clock-seconds');
      if (seconds !== lastRecordedSec) {
        secEl.textContent = strS;
        secEl.classList.remove('sec-tick-effect');
        void secEl.offsetWidth; // Force CSS reflow to re-trigger pulse
        secEl.classList.add('sec-tick-effect');
        lastRecordedSec = seconds;
      }

      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
      
      document.getElementById('live-date-header').textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
      document.getElementById('cal-month-header').textContent = months[now.getMonth()];
    }

    /* ================= 2. Real-Time Calendar Grid ================= */
    function buildLiveCalendar() {
      const grid = document.getElementById('cal-matrix-body');
      grid.innerHTML = '';

      const now = new Date();
      const yr = now.getFullYear();
      const mo = now.getMonth();
      const currentDay = now.getDate();

      const offset = new Date(yr, mo, 1).getDay();
      const totalDays = new Date(yr, mo + 1, 0).getDate();

      for (let i = 0; i < offset; i++) {
        grid.appendChild(document.createElement('span'));
      }

      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement('span');
        cell.textContent = d;
        if (d === currentDay) cell.classList.add('today-active');
        grid.appendChild(cell);
      }
    }

    /* ================= 3. Hardware Battery Sensor ================= */
    if ('getBattery' in navigator) {
      navigator.getBattery().then(bat => {
        function syncBattery() {
          const level = Math.round(bat.level * 100);
          document.getElementById('battery-num-txt').textContent = `${level}%`;
          document.getElementById('battery-state-txt').textContent = bat.charging ? 'AC POWER (CHARGING)' : 'BATTERY LEVEL';
          
          const offset = 120 - (120 * level / 100);
          document.getElementById('battery-fill-svg').style.strokeDashoffset = offset;
        }
        syncBattery();
        bat.addEventListener('levelchange', syncBattery);
        bat.addEventListener('chargingchange', syncBattery);
      });
    }

    /* ================= 4. Live Dhaka Weather (Open-Meteo API) ================= */
    async function updateDhakaWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=23.8103&longitude=90.4125&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FDhaka');
        const data = await res.json();

        if (data && data.current) {
          const temp = Math.round(data.current.temperature_2m);
          const max = Math.round(data.daily.temperature_2m_max[0]);
          const min = Math.round(data.daily.temperature_2m_min[0]);
          const code = data.current.weather_code;

          let desc = "Clear Skies";
          if (code >= 1 && code <= 3) desc = "Partly Cloudy";
          else if (code >= 45 && code <= 48) desc = "Haze & Mist";
          else if (code >= 51 && code <= 67) desc = "Light Rain";
          else if (code >= 80 && code <= 99) desc = "Showers";

          document.getElementById('weather-temp-txt').textContent = `${temp}°`;
          document.getElementById('weather-details-txt').innerHTML = `${desc}<br><span id="weather-range-txt">H: ${max}° L: ${min}°</span>`;
        }
      } catch (err) {
        document.getElementById('weather-temp-txt').textContent = "28°";
        document.getElementById('weather-details-txt').innerHTML = `Partly Cloudy<br><span>H: 32° L: 24°</span>`;
      }
    }

    /* ================= 5. Live Market Tick Fluctuations ================= */
    let aaplBase = 245.80;
    let goldBase = 2728.50;

    function pulseMarketQuotes() {
      aaplBase += (Math.random() * 0.35 - 0.16);
      goldBase += (Math.random() * 1.1 - 0.48);

      document.getElementById('aapl-price').textContent = `$${aaplBase.toFixed(2)}`;
      document.getElementById('gold-price').textContent = `$${goldBase.toFixed(2)}`;
    }

    /* ================= 6. 3D Optical Bokeh Snow Engine (Zero-Lag on TV) ================= */
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const TOTAL_FLAKES = 55;
    const flakes = [];

    for (let i = 0; i < TOTAL_FLAKES; i++) {
      const zDepth = Math.random(); // 0 = far background, 1 = near foreground
      flakes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        z: zDepth,
        radius: (zDepth * 3.0) + 0.8,
        speed: (zDepth * 0.85) + 0.35,
        swingSpeed: Math.random() * 0.02 + 0.01,
        swingAngle: Math.random() * Math.PI * 2,
        swingDist: (zDepth * 1.5) + 0.5,
        opacity: (zDepth * 0.6) + 0.25
      });
    }

    function render3DSnow() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < TOTAL_FLAKES; i++) {
        const flake = flakes[i];

        flake.swingAngle += flake.swingSpeed;
        const windDrift = Math.sin(flake.swingAngle) * flake.swingDist;

        flake.y += flake.speed;
        flake.x += windDrift + 0.15; // Gentle breeze

        if (flake.y > height + 10) {
          flake.y = -10;
          flake.x = Math.random() * width;
        }
        if (flake.x > width + 10) flake.x = -5;
        if (flake.x < -10) flake.x = width + 5;

        ctx.beginPath();
        if (flake.z > 0.65) {
          const grad = ctx.createRadialGradient(flake.x, flake.y, 0, flake.x, flake.y, flake.radius);
          grad.addColorStop(0, `rgba(255, 255, 255, ${flake.opacity})`);
          grad.addColorStop(0.7, `rgba(255, 255, 255, ${flake.opacity * 0.5})`);
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
        } else {
          ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
        }
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(render3DSnow);
    }

    /* ================= 7. Auto-Fullscreen Toggle ================= */
    function enterFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    window.addEventListener('click', enterFullscreen);
    window.addEventListener('keydown', enterFullscreen);

    // Initial Execution
    refreshSystemTime();
    buildLiveCalendar();
    updateDhakaWeather();
    render3DSnow();

    // High Precision Timers
    setInterval(refreshSystemTime, 500); // 500ms sync guarantees accurate zero-delay seconds
    setInterval(pulseMarketQuotes, 3600); // 3.6s market pulse
    setInterval(updateDhakaWeather, 1200000); // Refresh weather every 20 mins
  </script>
</body>
