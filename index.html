<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Ultra Liquid Glass AOD - Final Masterpiece Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --theme-accent: #30d158;
      --theme-glow: rgba(48, 209, 88, 0.25);
      --theme-date: #ffffff;
      --water-stroke: rgba(255, 255, 255, 0.65);
      --theme-digit-grad: linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0.25) 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000205;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #ffffff;
      position: relative;
    }

    /* 20+ Real Luxury Wallpapers */
    .tv-wallpaper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      z-index: 1;
      filter: brightness(0.6) contrast(1.25) saturate(1.3);
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .tv-wallpaper.active { opacity: 1; }

    #wall-1 { background-image: url('tvwall.jpg'); }
    #wall-2 { background-image: url('tv wall.jpg'); }
    #wall-3 { background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2070&auto=format&fit=crop'); }
    #wall-4 { background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073&auto=format&fit=crop'); }
    #wall-5 { background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop'); }
    #wall-6 { background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2070&auto=format&fit=crop'); }
    #wall-7 { background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop'); }
    #wall-8 { background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070&auto=format&fit=crop'); }
    #wall-9 { background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop'); }
    #wall-10 { background-image: url('https://images.unsplash.com/photo-1509114397022-ed747cca3f65?q=80&w=2070&auto=format&fit=crop'); }
    #wall-11 { background-image: url('https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?q=80&w=2070&auto=format&fit=crop'); }
    #wall-12 { background-image: url('https://images.unsplash.com/photo-1502134249126-9f3755a50d78?q=80&w=2070&auto=format&fit=crop'); }
    #wall-13 { background-image: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=2070&auto=format&fit=crop'); }
    #wall-14 { background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=2074&auto=format&fit=crop'); }
    #wall-15 { background-image: url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=2072&auto=format&fit=crop'); }
    #wall-16 { background-image: url('https://images.unsplash.com/photo-1508739773434-c26b3d09e071?q=80&w=2070&auto=format&fit=crop'); }
    #wall-17 { background-image: url('https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?q=80&w=2070&auto=format&fit=crop'); }
    #wall-18 { background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop'); }
    #wall-19 { background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2064&auto=format&fit=crop'); }
    #wall-20 { background-image: url('https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?q=80&w=2064&auto=format&fit=crop'); }

    .cinematic-vignette {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 75% 35%, rgba(0,0,0,0.02) 0%, rgba(0,2,5,0.9) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .top-status-indicator {
      position: absolute;
      top: 18px; right: 30px;
      z-index: 10;
    }

    .status-capsule {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      padding: 6px 14px;
      border-radius: 99px;
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .pulse-dot {
      width: 6px; height: 6px;
      background: var(--theme-accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--theme-accent);
    }

    /* Layout Viewport */
    .aod-viewport {
      position: relative;
      width: 100%; height: 100%;
      padding: 2vh 3.5vw;
      display: grid;
      grid-template-columns: 290px 1fr;
      align-items: center;
      z-index: 5;
    }

    .left-dock-column {
      height: 96vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 6;
    }

    .compact-glass-card {
      position: relative;
      width: 100%;
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(25px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Calendar */
    .cal-title-bar {
      font-family: 'Cinzel', serif;
      font-size: 8.5px; font-weight: 700;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 3px;
    }
    .cal-days-head {
      display: grid; grid-template-columns: repeat(7, 1fr);
      text-align: center; font-size: 7px; color: rgba(255, 255, 255, 0.4);
      margin-bottom: 2px;
    }
    .cal-numbers-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      text-align: center; gap: 1px; font-size: 9px; color: rgba(255, 255, 255, 0.9);
    }
    .cal-numbers-grid span {
      display: flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%;
    }
    .cal-numbers-grid span.active-today {
      background: var(--theme-accent);
      color: #000205; font-weight: 700;
    }

    /* TradingView Market Tickers */
    .market-list { display: flex; flex-direction: column; gap: 5px; }
    .market-item { display: grid; grid-template-columns: 72px 1fr 60px; align-items: center; gap: 5px; }
    .market-name { font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700; color: var(--theme-accent); }
    .market-sub { font-size: 7px; color: rgba(255,255,255,0.45); }
    .sparkline-svg { width: 100%; height: 18px; overflow: visible; }
    .sparkline-path { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sparkline-fill { opacity: 0.2; }
    .market-digits { text-align: right; font-family: 'JetBrains Mono', monospace; }
    .market-price { font-size: 10.5px; font-weight: 600; }
    .market-gain { font-size: 7.5px; font-weight: 600; }

    /* Music Player */
    .yt-music-widget { display: flex; flex-direction: column; gap: 5px; }
    .yt-header { display: flex; justify-content: space-between; align-items: center; font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 1.2px; color: rgba(255,255,255,0.6); }
    .yt-player-box { display: flex; align-items: center; gap: 8px; }
    .yt-thumbnail { width: 36px; height: 36px; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
    .yt-info { flex-grow: 1; overflow: hidden; }
    .yt-song-title { font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .yt-artist { font-size: 8px; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .yt-subtitles-box { width: 100%; height: 15px; overflow: hidden; text-align: center; background: rgba(0,0,0,0.25); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    .yt-subtitle-text { font-size: 7.5px; font-style: italic; color: var(--theme-accent); white-space: nowrap; }
    .yt-controls { display: flex; align-items: center; justify-content: space-between; }
    .yt-btn-group { display: flex; gap: 5px; align-items: center; }
    .yt-ctrl-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 23px; height: 23px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; cursor: pointer; }
    .yt-ctrl-btn:hover { background: var(--theme-accent); color: #000; }

    /* Compact Battery & Weather */
    .power-compact-pill { width: fit-content; display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 99px; }
    .power-ring { position: relative; width: 22px; height: 22px; }
    .power-ring svg { transform: rotate(-90deg); width: 22px; height: 22px; }
    .rail-bg { stroke: rgba(255,255,255,0.12); stroke-width: 2.5; fill: none; }
    .rail-fill { stroke: var(--theme-accent); stroke-width: 2.5; stroke-linecap: round; fill: none; stroke-dasharray: 60; stroke-dashoffset: 0; transition: stroke 0.5s; }
    .power-bolt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 7px; }
    .power-pct { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; line-height: 1; }
    .power-label { font-size: 7px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; }

    .weather-box { padding: 0 2px; }
    .weather-tag { font-family: 'Cinzel', serif; font-size: 8.5px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,0.85); }
    .weather-temp-num { font-size: 30px; font-weight: 300; letter-spacing: -2px; line-height: 1; margin: 1px 0; color: var(--theme-accent); }
    .weather-sub-info { font-size: 8px; color: rgba(255,255,255,0.6); line-height: 1.25; }

    /* ================= Ultra-Transparent Long Glass Clock ================= */
    .timepiece-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-left: -20px; }
    .date-banner { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--theme-date); margin-bottom: 10px; text-shadow: 0 4px 18px rgba(0,0,0,0.9); transition: color 0.5s; }
    .time-housing { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.5vw; }
    .digit-group { display: flex; gap: 0.25vw; }
    .flip-digit-card { position: relative; width: 7.2vw; height: 22vw; perspective: 1200px; }
    .digit-face {
      position: absolute; width: 100%; height: 100%;
      font-family: 'Antonio', sans-serif; font-size: 20vw; font-weight: 700; line-height: 1.05; text-align: center;
      background: var(--theme-digit-grad);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1.4px var(--water-stroke);
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.85));
      display: flex; align-items: center; justify-content: center; backface-visibility: hidden;
      transition: background 0.5s, -webkit-text-stroke 0.5s;
    }
    .flip-digit-card::after {
      content: ''; position: absolute; top: 50%; left: 8%; width: 84%; height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); z-index: 10;
    }
    .time-colon {
      font-family: 'Antonio', sans-serif; font-size: 13vw; font-weight: 700; line-height: 1; margin: 0 0.15vw;
      background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.1));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.4); filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
    }
    .seconds-capsule-container {
      position: absolute; right: -9.5vw; bottom: 12%;
      display: flex; gap: 0.25vw; padding: 6px 10px; border-radius: 14px;
      background: rgba(255,255,255,0.02); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 15px 30px rgba(0,0,0,0.6); z-index: 10;
    }
    .flip-sec-card { position: relative; width: 1.6vw; height: 3vw; perspective: 400px; }
    .sec-digit-face {
      position: absolute; width: 100%; height: 100%;
      font-family: 'Antonio', sans-serif; font-size: 3vw; font-weight: 700; line-height: 1;
      color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.85);
      display: flex; align-items: center; justify-content: center;
    }
    .sec-label-tag { position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); font-family: 'Cinzel', serif; font-size: 6px; letter-spacing: 1.2px; font-weight: 700; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>

  <audio id="audio-player" crossorigin="anonymous"></audio>

  <svg style="height:0; width:0; position:absolute;">
    <defs>
      <linearGradient id="tv-green-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#30d158" stop-opacity="0.5"/><stop offset="100%" stop-color="#30d158" stop-opacity="0.0"/></linearGradient>
      <linearGradient id="tv-red-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff453a" stop-opacity="0.5"/><stop offset="100%" stop-color="#ff453a" stop-opacity="0.0"/></linearGradient>
      <linearGradient id="tv-yellow-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd60a" stop-opacity="0.5"/><stop offset="100%" stop-color="#ffd60a" stop-opacity="0.0"/></linearGradient>
    </defs>
  </svg>

  <div class="tv-wallpaper active" id="wall-1"></div>
  <div class="tv-wallpaper" id="wall-2"></div>
  <div class="tv-wallpaper" id="wall-3"></div>
  <div class="tv-wallpaper" id="wall-4"></div>
  <div class="tv-wallpaper" id="wall-5"></div>
  <div class="tv-wallpaper" id="wall-6"></div>
  <div class="tv-wallpaper" id="wall-7"></div>
  <div class="tv-wallpaper" id="wall-8"></div>
  <div class="tv-wallpaper" id="wall-9"></div>
  <div class="tv-wallpaper" id="wall-10"></div>
  <div class="tv-wallpaper" id="wall-11"></div>
  <div class="tv-wallpaper" id="wall-12"></div>
  <div class="tv-wallpaper" id="wall-13"></div>
  <div class="tv-wallpaper" id="wall-14"></div>
  <div class="tv-wallpaper" id="wall-15"></div>
  <div class="tv-wallpaper" id="wall-16"></div>
  <div class="tv-wallpaper" id="wall-17"></div>
  <div class="tv-wallpaper" id="wall-18"></div>
  <div class="tv-wallpaper" id="wall-19"></div>
  <div class="tv-wallpaper" id="wall-20"></div>

  <div class="cinematic-vignette"></div>

  <aside class="top-status-indicator">
    <div class="status-capsule" onclick="switchThemeWallpaper()" title="Click to Switch Theme">
      <span class="pulse-dot"></span>
      <span id="wall-switch-txt">THEME 1 • SNOW CLIFF</span>
    </div>
  </aside>

  <main class="aod-viewport">
    <section class="left-dock-column">
      <!-- Calendar -->
      <div class="compact-glass-card">
        <div class="cal-title-bar" id="cal-month-title">OCTOBER</div>
        <div class="cal-days-head"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
        <div class="cal-numbers-grid" id="cal-grid-cells"></div>
      </div>

      <!-- TradingView Market Tickers -->
      <div class="compact-glass-card">
        <div class="market-list">
          <div class="market-item">
            <div><div class="market-name">USD/BDT</div><div class="market-sub">US Dollar</div></div>
            <svg class="sparkline-svg"><path class="sparkline-fill" id="usd-fill" d=""></path><path class="sparkline-path" id="usd-spark" d=""></path></svg>
            <div class="market-digits"><div class="market-price" id="usd-price">--.--</div><div class="market-gain" id="usd-gain">LIVE</div></div>
          </div>
          <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.06);">
          <div class="market-item">
            <div><div class="market-name">SAR/BDT</div><div class="market-sub">Saudi Riyal</div></div>
            <svg class="sparkline-svg"><path class="sparkline-fill" id="sar-fill" d=""></path><path class="sparkline-path" id="sar-spark" d=""></path></svg>
            <div class="market-digits"><div class="market-price" id="sar-price">--.--</div><div class="market-gain" id="sar-gain">LIVE</div></div>
          </div>
          <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.06);">
          <div class="market-item">
            <div><div class="market-name">AED/BDT</div><div class="market-sub">UAE Dirham</div></div>
            <svg class="sparkline-svg"><path class="sparkline-fill" id="aed-fill" d=""></path><path class="sparkline-path" id="aed-spark" d=""></path></svg>
            <div class="market-digits"><div class="market-price" id="aed-price">--.--</div><div class="market-gain" id="aed-gain">LIVE</div></div>
          </div>
        </div>
      </div>

      <!-- Music Player with Your Custom Playlist -->
      <div class="compact-glass-card">
        <div class="yt-music-widget">
          <div class="yt-header"><span id="yt-status-badge">NOW PLAYING</span><span id="track-count">1/6</span></div>
          <div class="yt-player-box">
            <div class="yt-thumbnail" id="yt-thumb" style="background-image: url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=300&auto=format&fit=crop');"></div>
            <div class="yt-info">
              <div class="yt-song-title" id="yt-song-title">Montagem Zora</div>
              <div class="yt-artist" id="yt-artist">Phonk / Bass Boosted</div>
            </div>
          </div>
          <div class="yt-subtitles-box"><span class="yt-subtitle-text" id="yt-subtitle">🎵 Pumping heavy bass & crisp rhythm...</span></div>
          <div class="yt-controls">
            <div class="yt-btn-group">
              <button class="yt-ctrl-btn" onclick="ytPrev()">⏮</button>
              <button class="yt-ctrl-btn" id="yt-play-btn" onclick="ytTogglePlay()">▶</button>
              <button class="yt-ctrl-btn" onclick="ytNext()">⏭</button>
            </div>
            <button class="yt-ctrl-btn" onclick="ytOpenExternal()">↗</button>
          </div>
        </div>
      </div>

      <!-- Battery & Weather Compact Unit -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center;">
        <div class="compact-glass-card power-compact-pill" style="width: 100%;">
          <div class="power-ring">
            <svg><circle class="rail-bg" cx="11" cy="11" r="9"/><circle class="rail-fill" id="battery-rail-fill" cx="11" cy="11" r="9"/></svg>
            <span class="power-bolt">⚡</span>
          </div>
          <div><div class="power-pct" id="battery-pct-txt">100%</div><div class="power-label" id="battery-status-lbl">ONLINE</div></div>
        </div>

        <div class="compact-glass-card weather-box" style="padding: 6px 10px;">
          <div class="weather-tag">DHAKA</div>
          <div class="weather-temp-num" id="dhaka-live-temp" style="font-size: 24px;">--°</div>
          <div class="weather-sub-info" id="dhaka-weather-desc" style="font-size: 7.5px;">Syncing...</div>
        </div>
      </div>
    </section>

    <!-- Center Stage Timepiece -->
    <section class="timepiece-stage">
      <div class="date-banner" id="live-date-str">SUNDAY, OCTOBER 18</div>
      <div class="time-housing">
        <div class="digit-group">
          <div class="flip-digit-card" id="card-h1"><div class="digit-face" id="h1">1</div></div>
          <div class="flip-digit-card" id="card-h2"><div class="digit-face" id="h2">2</div></div>
        </div>
        <span class="time-colon">:</span>
        <div class="digit-group">
          <div class="flip-digit-card" id="card-m1"><div class="digit-face" id="m1">0</div></div>
          <div class="flip-digit-card" id="card-m2"><div class="digit-face" id="m2">0</div></div>
        </div>
        <div class="seconds-capsule-container">
          <div class="flip-sec-card" id="card-s1"><div class="sec-digit-face" id="s1">0</div></div>
          <div class="flip-sec-card" id="card-s2"><div class="sec-digit-face" id="s2">0</div></div>
          <div class="sec-label-tag">SEC</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    /* Clock Engine */
    let lastDigits = { h1: '', h2: '', m1: '', m2: '', s1: '', s2: '' };
    function updateSingleDigit(id, newVal) {
      if (lastDigits[id] !== newVal) {
        document.getElementById(id).textContent = newVal;
        lastDigits[id] = newVal;
      }
    }
    function runClockEngine() {
      const now = new Date();
      let hours = now.getHours() % 12 || 12;
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();
      const strH = String(hours).padStart(2, '0');
      const strM = String(minutes).padStart(2, '0');
      const strS = String(seconds).padStart(2, '0');

      updateSingleDigit('h1', strH[0]);
      updateSingleDigit('h2', strH[1]);
      updateSingleDigit('m1', strM[0]);
      updateSingleDigit('m2', strM[1]);
      updateSingleDigit('s1', strS[0]);
      updateSingleDigit('s2', strS[1]);

      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
      document.getElementById('live-date-str').textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
      document.getElementById('cal-month-title').textContent = months[now.getMonth()];
    }

    function buildCalendar() {
      const grid = document.getElementById('cal-grid-cells');
      grid.innerHTML = '';
      const now = new Date();
      const yr = now.getFullYear(), mo = now.getMonth(), currentDay = now.getDate();
      const offset = new Date(yr, mo, 1).getDay();
      const totalDays = new Date(yr, mo + 1, 0).getDate();
      for (let i = 0; i < offset; i++) grid.appendChild(document.createElement('span'));
      for (let d = 1; d <= totalDays; d++) {
        const cell = document.createElement('span');
        cell.textContent = d;
        if (d === currentDay) cell.classList.add('active-today');
        grid.appendChild(cell);
      }
    }

    /* Battery State */
    if ('getBattery' in navigator) {
      navigator.getBattery().then(bat => {
        function syncBat() {
          const lvl = Math.round(bat.level * 100);
          document.getElementById('battery-pct-txt').textContent = `${lvl}%`;
          document.getElementById('battery-rail-fill').style.strokeDashoffset = 60 - (60 * lvl / 100);
        }
        syncBat();
        bat.addEventListener('levelchange', syncBat);
      });
    }

        const data = await res.json();
        if (data && data.current) {
          const temp = Math.round(data.current.temperature_2m);
          const max = Math.round(data.daily.temperature_2m_max[0]);
          const min = Math.round(data.daily.temperature_2m_min[0]);
          document.getElementById('dhaka-live-temp').textContent = `${temp}°`;
          document.getElementById('dhaka-weather-desc').innerHTML = `Clear<br>H:${max}° L:${min}°`;
        }

        document.getElementById('dhaka-live-temp').textContent = "28°";

      { title: "Deshi Kalakar", artist: "Desi Urban Fusion", src: "https://cdn.pixabay.com/download/audio/2022/11/06/audio_c29c87d478.mp3?filename=smooth-jazz-126262.mp3", art: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?q=80&w=300&auto=format&fit=crop", subs: ["🎵 Cultural fusion beats...", "🥁 Desi rhythm & soul vibes..."] },

    let currentTrackIdx = 0;
    let subInterval = null;

    function loadTrack(idx) {
      const track = playlist[idx];
      document.getElementById('yt-song-title').textContent = track.title;
      document.getElementById('yt-artist').textContent = track.artist;
      document.getElementById('yt-thumb').style.backgroundImage = `url('${track.art}')`;
      document.getElementById('track-count').textContent = `${idx + 1}/${playlist.length}`;
      audio.src = track.src;

      let subIdx = 0;
      const subEl = document.getElementById('yt-subtitle');
      if (subInterval) clearInterval(subInterval);
      subEl.textContent = track.subs[0];
      subInterval = setInterval(() => {
        if (!audio.paused) {
          subIdx = (subIdx + 1) % track.subs.length;
          subEl.textContent = track.subs[subIdx];
        }
      }, 4000);
    }

    function ytTogglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          document.getElementById('yt-play-btn').textContent = '⏸';
          document.getElementById('yt-status-badge').textContent = 'PLAYING';
        }).catch(e => console.log(e));
      } else {
        audio.pause();
        document.getElementById('yt-play-btn').textContent = '▶';
        document.getElementById('yt-status-badge').textContent = 'PAUSED';
      }
    }

    function ytNext() {
      currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
      loadTrack(currentTrackIdx);
      ytTogglePlay();
    }

    function ytPrev() {
      currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIdx);
      ytTogglePlay();
    }

    audio.addEventListener('ended', () => {
      ytNext();
    });

    /* TradingView Market Tickers Engine */
    let marketTickers = {
      usd: { points: [12, 13, 11, 15, 14, 16, 15], color: '#30d158', grad: 'url(#tv-green-grad)' },
      sar: { points: [10, 11, 9, 12, 11, 13, 12], color: '#30d158', grad: 'url(#tv-green-grad)' },
      aed: { points: [11, 10, 13, 12, 14, 13, 15], color: '#30d158', grad: 'url(#tv-green-grad)' }
    };

    function renderPath(arr) {
      let min = Math.min(...arr), max = Math.max(...arr), range = max - min || 1;
      let pts = arr.map((val, idx) => ({ x: (idx / 6) * 75, y: 18 - ((val - min) / range) * 12 }));
      let d = `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
      for (let i = 0; i < pts.length - 1; i++) {
        let p1 = pts[i], p2 = pts[i + 1], cx = (p1.x + p2.x) / 2;
        d += ` C ${cx.toFixed(1)},${p1.y.toFixed(1)} ${cx.toFixed(1)},${p2.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
      }
      return { strokePath: d, fillPath: `${d} L 75,20 L 0,20 Z` };
    }

    function stepMarket() {
      ['usd', 'sar', 'aed'].forEach(id => {
        let t = marketTickers[id], arr = t.points;
        let delta = (Math.random() * 1.5 - 0.73);
        t.color = delta >= 0.2 ? '#30d158' : (delta <= -0.2 ? '#ff453a' : '#ffd60a');
        t.grad = delta >= 0.2 ? 'url(#tv-green-grad)' : (delta <= -0.2 ? 'url(#tv-red-grad)' : 'url(#tv-yellow-grad)');

        arr.shift(); arr.push(Math.max(5, Math.min(25, arr[arr.length-1] + delta)));
        let p = renderPath(arr);

        document.getElementById(`${id}-spark`).setAttribute('d', p.strokePath);
        document.getElementById(`${id}-spark`).style.stroke = t.color;
        document.getElementById(`${id}-fill`).setAttribute('d', p.fillPath);
        document.getElementById(`${id}-fill`).style.fill = t.grad;

        const gain = document.getElementById(`${id}-gain`);
        gain.textContent = `${delta >= 0 ? '+' : ''}${(delta * 0.3).toFixed(2)}%`;
        gain.style.color = t.color;
      });
    }

    async function fetchRates() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await res.json();
        if (data && data.rates) {
          document.getElementById('usd-price').textContent = data.rates.BDT.toFixed(2);
          document.getElementById('sar-price').textContent = (data.rates.BDT / data.rates.SAR).toFixed(2);
          document.getElementById('aed-price').textContent = (data.rates.BDT / data.rates.AED).toFixed(2);
        }
      } catch (e) {}
    }

    function switchThemeWallpaper() {
      document.getElementById(`wall-${currentTheme}`).classList.remove('active');
      currentTheme = (currentTheme % 20) + 1;
      document.getElementById(`wall-${currentTheme}`).classList.add('active');

      const style = themeStyles[currentTheme - 1];
      document.getElementById('wall-switch-txt').textContent = style.name;
      
      const root = document.documentElement;
      root.style.setProperty('--theme-accent', style.accent);
      root.style.setProperty('--theme-date', style.date);
      root.style.setProperty('--water-stroke', style.stroke);
      root.style.setProperty('--theme-digit-grad', style.grad);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'W') switchThemeWallpaper();
    });

    // Initialization
    runClockEngine();
    buildCalendar();
    syncWeather();
    fetchRates();
    loadTrack(currentTrackIdx);
    stepMarket();

    setInterval(runClockEngine, 1000);
    setInterval(stepMarket, 2200);

    setInterval(syncWeather, 1200000);
